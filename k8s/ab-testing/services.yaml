# Internal services, one per variant. Users reach them through the router.
apiVersion: v1
kind: Service
metadata:
  name: aceest-a
  namespace: aceest-ab
spec:
  selector:
    app: aceest
    variant: a
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-b
  namespace: aceest-ab
spec:
  selector:
    app: aceest
    variant: b
  ports:
    - port: 80
      targetPort: 5000
