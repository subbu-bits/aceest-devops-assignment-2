# ROLLING UPDATE
# Pods are replaced one at a time. maxUnavailable: 0 means a new pod must be
# Ready (passing /health) before an old one is removed: zero downtime.
# Rollback: kubectl -n aceest-rolling rollout undo deployment/aceest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest
  namespace: aceest-rolling
  labels:
    app: aceest
spec:
  replicas: 3
  revisionHistoryLimit: 10
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aceest
  template:
    metadata:
      labels:
        app: aceest
    spec:
      containers:
        - name: aceest
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
