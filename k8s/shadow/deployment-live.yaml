# SHADOW - live: the version users actually get answers from.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-live
  namespace: aceest-shadow
  labels:
    app: aceest
    role: live
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest
      role: live
  template:
    metadata:
      labels:
        app: aceest
        role: live
    spec:
      containers:
        - name: aceest
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
