# Internal services. Users reach them through the router.
apiVersion: v1
kind: Service
metadata:
  name: aceest-live
  namespace: aceest-shadow
spec:
  selector:
    app: aceest
    role: live
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow
  namespace: aceest-shadow
spec:
  selector:
    app: aceest
    role: shadow
  ports:
    - port: 80
      targetPort: 5000
