# SonarQube static analysis settings (read by sonar-scanner in Jenkins)
sonar.projectKey=aceest-fitness
sonar.projectName=ACEest Fitness & Gym
sonar.sourceEncoding=UTF-8

# What to analyse
sonar.sources=app.py,scripts
sonar.tests=tests
sonar.python.version=3.9, 3.12

# Reports produced by the "Unit Tests" stage
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml
